# 로컬 개발 전용 인프라다. 운영 배포 파일로 사용하지 않는다.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${PG_USER:-saver}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
      POSTGRES_DB: ${PG_DATABASE:-saverdb}
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - saver-postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - saver-redis:/data

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - saver-rabbitmq:/var/lib/rabbitmq

volumes:
  saver-postgres:
  saver-redis:
  saver-rabbitmq:
