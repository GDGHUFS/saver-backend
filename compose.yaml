services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${PG_USER:-saver}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-saver}
      POSTGRES_DB: ${PG_DATABASE:-saverdb}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - saver-postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - saver-redis:/data

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"
    volumes:
      - saver-rabbitmq:/var/lib/rabbitmq

volumes:
  saver-postgres:
  saver-redis:
  saver-rabbitmq:
