name: Build and push container image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Container image tag
        required: true
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}-${{ inputs.image_tag }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_REGISTRY: ${{ secrets.DOCKERHUB_REGISTRY != '' && secrets.DOCKERHUB_REGISTRY || vars.DOCKERHUB_REGISTRY != '' && vars.DOCKERHUB_REGISTRY || 'docker.io' }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_REPOSITORY: ${{ secrets.DOCKERHUB_REPOSITORY != '' && secrets.DOCKERHUB_REPOSITORY || vars.DOCKERHUB_REPOSITORY != '' && vars.DOCKERHUB_REPOSITORY || github.event.repository.name }}
    steps:
      - name: Check required secrets
        shell: bash
        run: |
          missing=0
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Required secret ${name} is not configured"
              missing=1
            fi
          done
          for name in DOCKERHUB_REGISTRY DOCKERHUB_REPOSITORY; do
            if [ -z "${!name}" ]; then
              echo "::error::Required configuration ${name} is not configured"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "::error::Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN as Actions secrets. DOCKERHUB_REGISTRY/DOCKERHUB_REPOSITORY can use repository variables or defaults."
          fi
          exit "${missing}"

      - name: Validate image tag
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "${IMAGE_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::image_tag is not a valid Docker tag"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
